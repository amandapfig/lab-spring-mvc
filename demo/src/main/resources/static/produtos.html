<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos - Lab Spring MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Produtos</h1>

    <form id="form-produto" class="row g-2 mb-4">
        <input type="hidden" id="produto-id">
        <div class="col-md-6">
            <input type="text" id="produto-nome" class="form-control" placeholder="Nome" required>
        </div>
        <div class="col-md-3">
            <input type="number" id="produto-preco" class="form-control" placeholder="Preço" step="0.01" min="0" required>
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill" id="btn-salvar">Adicionar</button>
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar">Cancelar</button>
        </div>
    </form>

    <div id="alerta" class="alert alert-danger d-none"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody id="lista-produtos"></tbody>
    </table>

    <a href="/">Voltar</a>
</div>

<script>
    const API_URL = '/api/produtos';

    const form = document.getElementById('form-produto');
    const campoId = document.getElementById('produto-id');
    const campoNome = document.getElementById('produto-nome');
    const campoPreco = document.getElementById('produto-preco');
    const btnSalvar = document.getElementById('btn-salvar');
    const btnCancelar = document.getElementById('btn-cancelar');
    const lista = document.getElementById('lista-produtos');
    const alerta = document.getElementById('alerta');

    function mostrarErro(msg) {
        alerta.textContent = msg;
        alerta.classList.remove('d-none');
    }

    async function requisicao(url, opcoes = {}) {
        alerta.classList.add('d-none');
        const resposta = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            ...opcoes
        });
        if (!resposta.ok) {
            throw new Error('Erro ' + resposta.status + ' ao acessar a API');
        }
        return resposta.status === 204 ? null : resposta.json();
    }

    // READ: lista os produtos cadastrados
    async function carregarProdutos() {
        try {
            const produtos = await requisicao(API_URL);
            lista.innerHTML = '';
            produtos.forEach(produto => {
                const tr = document.createElement('tr');

                const tdNome = document.createElement('td');
                tdNome.textContent = produto.nome;

                const tdPreco = document.createElement('td');
                tdPreco.textContent = produto.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                const tdAcoes = document.createElement('td');
                tdAcoes.className = 'text-end';

                const btnEditar = document.createElement('button');
                btnEditar.className = 'btn btn-sm btn-outline-primary me-2';
                btnEditar.textContent = 'Editar';
                btnEditar.onclick = () => editarProduto(produto);

                const btnExcluir = document.createElement('button');
                btnExcluir.className = 'btn btn-sm btn-outline-danger';
                btnExcluir.textContent = 'Excluir';
                btnExcluir.onclick = () => excluirProduto(produto.id);

                tdAcoes.append(btnEditar, btnExcluir);
                tr.append(tdNome, tdPreco, tdAcoes);
                lista.appendChild(tr);
            });
        } catch (e) {
            mostrarErro(e.message);
        }
    }

    function editarProduto(produto) {
        campoId.value = produto.id;
        campoNome.value = produto.nome;
        campoPreco.value = produto.preco;
        btnSalvar.textContent = 'Salvar';
        btnCancelar.classList.remove('d-none');
    }

    function limparFormulario() {
        form.reset();
        campoId.value = '';
        btnSalvar.textContent = 'Adicionar';
        btnCancelar.classList.add('d-none');
    }

    // DELETE: remove um produto
    async function excluirProduto(id) {
        if (!confirm('Deseja excluir este produto?')) return;
        try {
            await requisicao(API_URL + '/' + id, { method: 'DELETE' });
            await carregarProdutos();
        } catch (e) {
            mostrarErro(e.message);
        }
    }

    // CREATE / UPDATE: envia o formulário
    form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const produto = {
            nome: campoNome.value,
            preco: parseFloat(campoPreco.value)
        };
        const id = campoId.value;
        try {
            if (id) {
                await requisicao(API_URL + '/' + id, { method: 'PUT', body: JSON.stringify(produto) });
            } else {
                await requisicao(API_URL, { method: 'POST', body: JSON.stringify(produto) });
            }
            limparFormulario();
            await carregarProdutos();
        } catch (e) {
            mostrarErro(e.message);
        }
    });

    btnCancelar.addEventListener('click', limparFormulario);

    carregarProdutos();
</script>
</body>
</html>
