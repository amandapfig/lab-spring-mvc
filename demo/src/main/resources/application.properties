spring.application.name=demo

# CONEXAO COM O MONGODB ATLAS -------
# Defina a variavel de ambiente MONGODB_URI com a Connection String do Atlas
# (Database > Connect > Drivers), trocando <username>, <password> e o nome do banco.
# Exemplo: mongodb+srv://usuario:senha@cluster0.xxxxx.mongodb.net/lab-mvc
# Nunca faca commit de credenciais reais neste arquivo.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lab-mvc}
spring.mongodb.database=${MONGODB_DB:lab-mvc}
