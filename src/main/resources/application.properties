server.max-http-request-header-size=65536

spring.application.name=lab-mvc

# CONEXAO COM O MONGODB ATLAS -------
# Substitua a URI abaixo pela Connection String fornecida pelo MongoDB Atlas
# (Database > Connect > Drivers), trocando <username>, <password> e o nome do banco.
# Exemplo: mongodb+srv://usuario:senha@cluster0.xxxxx.mongodb.net/lab-mvc
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lab-mvc}
spring.data.mongodb.database=${MONGODB_DB:lab-mvc}
